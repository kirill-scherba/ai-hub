# Release for the MCP servers that live inside this repository.
#
# Each tools/<name>-mcp.pl is a standalone Perl MCP server. A tag packages every one of them as its own
# archive, so a distribution catalog can point at "ai-hub cloudflare-mcp 1.0.0" without needing a separate
# repository per script. The suffix is the rule: everything else in tools/ is workshop material for
# tools.json and is never published.
name: tools-release

on:
  push:
    tags: ['tools-v*']

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every server compiles
        run: |
          set -euo pipefail
          fail=0
          for f in tools/*-mcp.pl generative-mcp-hub.pl; do
            if ! perl -c "$f" 2>/dev/null; then
              echo "syntax error: $f"; fail=1
            fi
          done
          exit $fail

      - name: Pack the hub itself
        # The hub is the server, not one of the tools it manages, so it does not live under tools/ and
        # is not caught by the loop below. It is shipped together with tools.json: the registry is what
        # an installation starts from, and a hub archive without it would start empty.
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#tools-v}"
          zip="ai-hub_${tag}.zip"
          mkdir -p pack/ai-hub
          cp generative-mcp-hub.pl tools.json pack/ai-hub/
          (cd pack/ai-hub && zip -q "../../$zip" generative-mcp-hub.pl tools.json)
          sha256sum "$zip" > "$zip.sha256"
          cat "$zip.sha256"

      - name: Pack each tool
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#tools-v}"
          for f in tools/*-mcp.pl; do
            name="$(basename "$f" .pl)"        # deploy-check-mcp
            short="${name%-mcp}"               # deploy-check
            zip="${short}_${tag}.zip"
            mkdir -p "pack/$short"
            cp "$f" "pack/$short/"
            (cd "pack/$short" && zip -q "../../$zip" "$(basename "$f")")
            sha256sum "$zip" > "$zip.sha256"
            cat "$zip.sha256"
          done
          ls -la *.zip | head -20

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.zip.sha256
